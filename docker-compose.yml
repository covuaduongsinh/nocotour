services:
  app:
    image: node:24.15.0-bookworm-slim
    container_name: nocotour-dsc-app
    restart: unless-stopped
    working_dir: /app
    command:
      - node
      - dist/server/standalone.js
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      APP_BASE_PATH: /main
      APP_SERVER_HOST: 0.0.0.0
      APP_SERVER_PORT: 13000
      APP_CONFIG_FILE: /app/config.yml
      APP_PUBLIC_ORIGIN: https://nocotour.dsc.edu.vn
      SECRETS_KEYS: 1:660feaea0ae393bf0f12c428fc78768694008989dcedc522a0e581e53545d4c2
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: covuaduongsinh@gmail.com
      INITIAL_ADMIN_PASSWORD: Dsc-BBby05lHXHFiJyIP
    volumes:
      - /srv/nocotour-dsc/releases/current/dist:/app/dist:ro
      - /srv/nocotour-dsc/config.yml:/app/config.yml:ro
      - /srv/nocotour-dsc/storage:/app/storage
      - /usr/local/bin/typst:/usr/local/bin/typst:ro
    expose:
      - "13000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:13000/main/api/healthz',{signal:AbortSignal.timeout(3000)}).then(async r=>process.exit(r.ok&&(await r.json()).ok===true?0:1)).catch(()=>process.exit(1))
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
    labels:
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.nocotour-dsc-web.rule=Host(`nocotour.dsc.edu.vn`)"
      - "traefik.http.routers.nocotour-dsc-web.entrypoints=web"
      - "traefik.http.services.nocotour-dsc-web.loadbalancer.server.port=13000"
      - "traefik.http.routers.nocotour-dsc-web.service=nocotour-dsc-web"
      - "traefik.http.routers.nocotour-dsc-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.nocotour-dsc-websecure.rule=Host(`nocotour.dsc.edu.vn`)"
      - "traefik.http.routers.nocotour-dsc-websecure.entrypoints=websecure"
      - "traefik.http.services.nocotour-dsc-websecure.loadbalancer.server.port=13000"
      - "traefik.http.routers.nocotour-dsc-websecure.service=nocotour-dsc-websecure"
      - "traefik.http.routers.nocotour-dsc-websecure.tls.certresolver=letsencrypt"
      - "traefik.enable=true"
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
